name: Instagram Downloader (Profile Pic)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram username (public) to download profile picture'
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run downloader
        env:
          IG_USERNAME: ${{ github.event.inputs.username }}
        run: |
          echo "Running downloader for username: $IG_USERNAME"
          python download.py

          echo "--- Workspace files ---" > workspace_files.txt
          ls -lah >> workspace_files.txt

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add fastdl_output.html profile_pic.jpg workspace_files.txt || true
          git commit -m "Downloaded profile picture for ${{ github.event.inputs.username }}" || echo "No changes to commit"
          git push || echo "Nothing to push"
