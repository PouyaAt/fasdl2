name: Instagram Downloader

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Instagram username"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Run downloader
        env:
          IG_USERNAME: ${{ github.event.inputs.username }}
        run: |
          python download.py || true

      - name: Collect workspace debug files
        run: |
          echo "---- Workspace Files ----" > workspace_files.txt
          ls -lah >> workspace_files.txt

          echo "---- Git Status ----" > git_status.txt
          git status >> git_status.txt

      - name: Commit debug/output files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add *.txt *.html *.jpg 2>/dev/null || true

          git commit -m "Workflow run for ${{ github.event.inputs.username }}" || echo "No changes"

          git push
